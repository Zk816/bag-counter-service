groups:
  - name: bagcounter
    rules:
      - alert: BagcounterWorkerDown
        expr: absent(bagcounter_worker_heartbeat_timestamp_seconds{job="bagcounter-worker"}) or time() - bagcounter_worker_heartbeat_timestamp_seconds{job="bagcounter-worker"} > 60
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Inference worker is not running or its job loop is stuck"

      - alert: BagcounterSelftestFailing
        expr: bagcounter_selftest_ok{job="bagcounter-worker"} == 0 or time() - bagcounter_selftest_last_success_timestamp_seconds{job="bagcounter-worker"} > 900
        labels: { severity: critical }
        annotations:
          summary: "Model self-test failed or has not passed for 15 min: counts cannot be trusted"

      - alert: BagcounterCameraNoSignal
        expr: max by (stream) (bagcounter_stream_state{state=~"stalled|frozen"}) == 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Camera {{ $labels.stream }} has no picture (stalled or frozen)"

      - alert: BagcounterNoBagsCounted
        expr: |
          bagcounter_stream_state{state="live"} == 1
          and on (stream) increase(bagcounter_frames_processed_total[30m]) > 0
          and on (stream) (sum by (stream) (increase(bagcounter_bags_counted_total[30m])) or on (stream) bagcounter_stream_state{state="live"} * 0) == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Camera {{ $labels.stream }} is live but counted no bag in 30 min (line stopped, or the line/model is wrong)"

      - alert: BagcounterProcessingTooSlow
        expr: rate(bagcounter_frames_processed_total{stream!="job"}[5m]) < 5 and on (stream) bagcounter_stream_state{state="live"} == 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Camera {{ $labels.stream }} processed under 5 FPS: fast bags may be missed"

      - alert: BagcounterHighLatency
        expr: histogram_quantile(0.95, sum by (le, stream) (rate(bagcounter_frame_latency_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Camera {{ $labels.stream }}: p95 frame latency above 500 ms"

      - alert: BagcounterTrackFragmentation
        expr: |
          (sum by (stream) (increase(bagcounter_tracks_confirmed_total[1h])) / sum by (stream) (increase(bagcounter_bags_counted_total[1h])))
          > 2 * (sum by (stream) (increase(bagcounter_tracks_confirmed_total[1h] offset 1d)) / sum by (stream) (increase(bagcounter_bags_counted_total[1h] offset 1d)))
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Camera {{ $labels.stream }}: tracking became unstable versus yesterday"

      - alert: BagcounterLowDetectionConfidence
        expr: histogram_quantile(0.5, sum by (le, stream) (rate(bagcounter_detection_score_bucket{stream!="job"}[30m]))) < 0.4
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Camera {{ $labels.stream }}: median detection confidence below 0.4 (picture differs from training data)"

      - alert: BagcounterDiskLow
        expr: bagcounter_disk_free_bytes{job="bagcounter-worker"} < 5e9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Under 5 GB free on the data volume (uploads are refused under 2 GB)"

      - alert: BagcounterJobsFailing
        expr: increase(bagcounter_jobs_total{outcome="failed"}[1h]) > 2
        labels: { severity: warning }
        annotations:
          summary: "More than 2 video jobs failed in the last hour"

      - alert: BagcounterQueueBacklog
        expr: bagcounter_queue_depth > 10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "More than 10 video jobs waiting for 15 min"
