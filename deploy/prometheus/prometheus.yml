global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: bagcounter-api
    static_configs: [{ targets: ["api:8080"] }]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "bagcounter_http_.*|process_.*|python_.*"
        action: keep
  - job_name: bagcounter-worker
    static_configs: [{ targets: ["worker:9101"] }]
